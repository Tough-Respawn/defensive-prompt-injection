[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "defensive-prompt-injection"
version = "0.4.0"
description = "Harness-neutral policy engine for defensive prompt-injection gates"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Amine Harrak" }]
dependencies = []

[project.scripts]
dpi = "dpi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
